*/
const FB_VER = '10.12.2';
const APP_VERSION = '1.18.0', APP_DATE = '2026-11-23', APP_AUTHOR = 'K.Ogawa';
const ITER = 200; // 自動作成の試行回数(直・早番)
const TOPK = 8, DAY_TRY = 25; // 直・早番の上位8案それぞれで、日勤・中勤・半休・DC・3C当番を25通り試す
const MAX_FAILS = 8;
const AM_SPAN = [480, 720], PM_SPAN = [780, 1020]; // AM× = 8:00〜12:00、PM× = 13:00〜17:00 にかかる勤務に入れない // PINをこの回数続けて間違えるとロック

// ---------------- 基本ユーティリティ ----------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p='id') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const dk = d => 'd' + pad(d);
const ymStr = (y,m) => `${y}-${pad(m)}`;
const WD = ['日','月','火','水','木','金','土'];
function daysIn(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function dateOf(ym,d){ const [y,m] = ym.split('-').map(Number); return new Date(y,m-1,d); }
function iso(dt){ return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function todayISO(){ return iso(new Date()); }
function shiftYm(ym,k){ const [y,m] = ym.split('-').map(Number); const dt = new Date(y,m-1+k,1); return ymStr(dt.getFullYear(), dt.getMonth()+1); }
function toMin(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); if(isNaN(h)) return null; return h*60 + (m||0); }
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const md = d => { const n0 = daysIn(S.ym); return d <= n0 ? `${+S.ym.slice(5)}/${d}` : `${+shiftYm(S.ym,1).slice(5)}/${d - n0}`; };
const fmtTs = ts => { const t = new Date(ts); return `${t.getMonth()+1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}`; };
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display='none', 2600); }

// ---------------- 日本の祝日 ----------------
const holCache = {};
function jpHolidays(y){
  if(holCache[y]) return holCache[y];
  const H = {};
  const key = (m,d) => `${y}-${pad(m)}-${pad(d)}`;
  const add = (m,d,n) => { H[key(m,d)] = n; };
  const nthMon = (m,n) => { const f = new Date(y,m-1,1).getDay(); return 1 + ((8 - f) % 7) + (n-1)*7; };
  const k = y - 1980;
  add(1,1,'元日'); add(1,nthMon(1,2),'成人の日'); add(2,11,'建国記念の日');
  if(y >= 2020) add(2,23,'天皇誕生日');
  add(3,Math.floor(20.8431 + 0.242194*k - Math.floor(k/4)),'春分の日');
  add(4,29,'昭和の日'); add(5,3,'憲法記念日'); add(5,4,'みどりの日'); add(5,5,'こどもの日');
  add(7,nthMon(7,3),'海の日'); add(8,11,'山の日'); add(9,nthMon(9,3),'敬老の日');
  add(9,Math.floor(23.2488 + 0.242194*k - Math.floor(k/4)),'秋分の日');
  add(10,nthMon(10,2),'スポーツの日'); add(11,3,'文化の日'); add(11,23,'勤労感謝の日');
  // 振替休日
  for(const kk of Object.keys(H).sort()){
    const dt = new Date(kk + 'T00:00:00');
    if(dt.getDay() === 0){ const x = new Date(dt); do { x.setDate(x.getDate()+1); } while(H[iso(x)]); H[iso(x)] = '振替休日'; }
  }
  // 国民の休日(祝日に挟まれた平日)
  for(let dt = new Date(y,0,2); dt.getFullYear() === y; dt.setDate(dt.getDate()+1)){
    const kk = iso(dt); if(H[kk] || dt.getDay() === 0) continue;
    const a = new Date(dt); a.setDate(a.getDate()-1); const b = new Date(dt); b.setDate(b.getDate()+1);
    if(H[iso(a)] && H[iso(b)] && H[iso(a)] !== '振替休日') H[kk] = '国民の休日';
  }
  return holCache[y] = H;
}
function dayList(ym, cfg){
  const n = daysIn(ym), out = [];
  for(let d=1; d<=n; d++){
    const dt = dateOf(ym,d), key = iso(dt), wd = dt.getDay();
    const jp = jpHolidays(dt.getFullYear())[key];
    const ov = cfg?.holidayOverrides?.[key];
    let hol = wd===0 || wd===6 || !!jp;
    let holName = jp || (wd===0 ? '日曜' : wd===6 ? '土曜' : '');
    if(ov === true){ hol = true; holName = jp || '指定休日'; }
    if(ov === 'split'){ hol = true; holName = jp || '指定休日'; }
    if(ov === false){ hol = false; holName = '平日扱い'; }
    // 早遅分割:休日でも救急科直を早番・遅番の2人に分ける(連休など)
    const split = hol && (ov === 'split' || (cfg?.specialPeriods || []).some(sp => sp.split && sp.from <= key && key <= sp.to));
    out.push({d, iso:key, wd, hol, split, holName, jp:!!jp, ov});
  }
  return out;
}

function dayInfo(isoD, cfg){ return dayList(isoD.slice(0,7), cfg)[+isoD.slice(8) - 1]; }
const needsE = dy => !!dy && (!dy.hol || dy.split);
// ---------------- 勤務の定義 ----------------
const SH = {
  E:{l:'早', n:'早番', c:'sE'}, N:{l:'直', n:'救急科直', c:'sN'}, A:{l:'明', n:'明け', c:'sA'},
  D:{l:'日', n:'日勤', c:'sD'}, M:{l:'中', n:'中勤', c:'sM'}, X:{l:'外', n:'外勤', c:'sX'},
  DA:{l:'PM', n:'日勤(午前休・午後のみ)', c:'sH'}, DP:{l:'AM', n:'日勤(午後休・午前のみ)', c:'sH'},
  IM:{l:'セ内', n:'センター内科直(休日は当直)', c:'sI'}, SG:{l:'セ外', n:'センター外科直(休日は当直)', c:'sI'},
  IMD:{l:'セ内日', n:'センター内科日直', c:'sI'}, SGD:{l:'セ外日', n:'センター外科日直', c:'sI'},
  IC:{l:'ICU', n:'ICU直(休日は当直)', c:'sC'}, ICD:{l:'ICU日', n:'ICU日直', c:'sC'},
  HK:{l:'本館', n:'本館直(休日は当直)', c:'sK'}, HKD:{l:'本館日', n:'本館日直', c:'sK'},
  O:{l:'休', n:'休み', c:'sO'}, L:{l:'休職', n:'休職・産休等', c:'sL'}
};
const WORK = new Set(['E','N','D','M','X','IM','SG','IMD','SGD','IC','ICD','HK','HKD','DA','DP']);
const isNightN = c => c === 'N' || c === 'IC' || c === 'HK';   // 救急科直とICU/本館直(当直):翌日は明け・直の間隔と回数は合算
// センター勤務(他組織で決まる。こちらでは入力するだけ):平日=内科直・外科直、休日=内科/外科の日直・当直
const CENTER_CODES = ['IM','SG','IMD','SGD','IC','ICD','HK','HKD'];
const isCenter = c => CENTER_CODES.includes(c);
const isWardDuty = c => c === 'IC' || c === 'ICD' || c === 'HK' || c === 'HKD';   // ICU・本館(救急科直と回数を合算)
const SHORT = {IM:'セ内', SG:'セ外', IMD:'セ内日', SGD:'セ外日', IC:'ICU', ICD:'ICU日', HK:'本館', HKD:'本館日'};
const shortLab = (code, hol) => (SHORT[code] || '') + (hol && (code === 'IM' || code === 'SG' || code === 'IC' || code === 'HK') ? '当' : '');
const isCenterNight = c => c === 'IM' || c === 'SG';
const centerReq = r => r ? (r.im ? 'IM' : r.sg ? 'SG' : r.imd ? 'IMD' : r.sgd ? 'SGD' : r.icu ? 'IC' : r.icud ? 'ICD' : r.hon ? 'HK' : r.hond ? 'HKD' : '') : '';
const CENTER_KEYS = ['im','sg','imd','sgd','icu','icud','hon','hond'];
const KEY2CODE = {im:'IM', sg:'SG', imd:'IMD', sgd:'SGD', icu:'IC', icud:'ICD', hon:'HK', hond:'HKD'};
const WANT = {E:'早番', D:'日勤', M:'中勤', N:'夜勤'};
const centerLabel = (code, hol) => ({IM: hol ? 'センター内科当直' : 'センター内科直', SG: hol ? 'センター外科当直' : 'センター外科直', IMD:'センター内科日直', SGD:'センター外科日直', IC: hol ? 'ICU当直' : 'ICU直', ICD:'ICU日直', HK: hol ? '本館当直' : '本館直', HKD:'本館日直'})[code] || '';
const isHalf = c => c === 'DA' || c === 'DP';
const TYPE = {senmon:'専門医', senkou:'専攻医', visitor:'他院から来る医師', clerk:'事務(閲覧・出力)'};
const TYPE_S = {senmon:'専', senkou:'攻', visitor:'他', clerk:'事'};

    const pool = [], wk = weekKey(day.iso);
    for(const s of st){
      if(isVisitor(s) || gget(G,s.id,d)) continue;
      const bD = blocks(ctx,s.id,d,'D'), bM = blocks(ctx,s.id,d,'M') || noMBefore(ctx, G, s.id, d);
      if(!bD) pool.push({id:s.id, canM:!bM});

      else if(!blocks(ctx,s.id,d,'DA')) gset(G,n,s.id,d,{s:'DA'});   // AM×など → 日勤(午前休)

    // できれば中勤にしたい人:翌日がセンター直/当直、または直明け(センター直の翌日休み)の次の日
    const prefM = id => {
      const p1 = d > 1 ? gget(G,id,d-1)?.s : '', p2 = d > 2 ? gget(G,id,d-2)?.s : '';
      const n1 = d < n ? gget(G,id,d+1)?.s : ctx.nextCell1?.[id]?.s, rn = nextReqOf(ctx, id, d);
      return isCenterNight(n1) || !!(rn && (rn.im || rn.sg)) || p1 === 'A' || (p1 === 'O' && isCenterNight(p2));
    };
    const mWant = id => { const w = reqOf(ctx.month, id, d)?.want; return w === 'M' ? -3 : w ? 6 : 0; };   /* 中勤希望は弱め(午前休でもよい場合があるため) */
    const mKey = id => ((mW[id][wk] || 0) >= 2 ? 100 : 0) + mC[id] + Math.random() * 1.2 - (prefM(id) ? 4 : 0) + mWant(id);
    const mCands = pool.filter(p => p.canM).map(p => ({...p, k:mKey(p.id)})).sort((a,b) => a.k - b.k);
    const chosen = new Set();
    const typeOf = id => ctx.map[id]?.type === 'senmon' ? 'senmon' : 'other';
    const have = {senmon:0, other:0}; st.forEach(s => { if(gget(G,s.id,d)?.s === 'M') have[typeOf(s.id)]++; });
    while(chosen.size < mids){
      const rest = mCands.filter(p => !chosen.has(p.id)); if(!rest.length) break;
      const best = rest.map(p => ({p, k:p.k + (have[typeOf(p.id)] > 0 ? 3 : 0)})).sort((a,b) => a.k - b.k)[0].p;

      const repl = mCands.find(p => !chosen.has(p.id) && !canDC(ctx.map[p.id])); if(repl) chosen.add(repl.id);
    }
    for(const p of pool){ if(chosen.has(p.id)){ gset(G,n,p.id,d,{s:'M'}); mC[p.id]++; mW[p.id][wk] = (mW[p.id][wk] || 0) + 1; } else gset(G,n,p.id,d,{s:'D'}); }
    if(!st.some(s => gget(G,s.id,d)?.dc)){
      const dcs = st.filter(s => { const c = gget(G,s.id,d); return c?.s==='D' && canDC(s) && !c.lock; }).sort((a,b) => (dcC[a.id]-dcC[b.id]) || (Math.random()-.5));
      if(dcs[0]){ gget(G,dcs[0].id,d).dc = true; dcC[dcs[0].id]++; }
    }
    // 3C当番:日勤(DC以外)から1人。できるだけ3〜4年目
    if(set.use3C !== false && !st.some(s => gget(G,s.id,d)?.c3)){
      const pref = s => { const y = yearsOf(s, day.iso); return y === 3 || y === 4 ? 0 : (y == null ? 2 : 1); };
      const c3s = st.filter(s => { const c = gget(G,s.id,d); return c?.s==='D' && !isVisitor(s) && !c.dc && !c.lock; }).sort((a,b) => (pref(a)-pref(b)) || (c3C[a.id]-c3C[b.id]) || (Math.random()-.5));

function generate(ctx, keep){
  const n = ctx.n, st = ctx.staff, G = {};
  st.forEach(s => G[s.id] = {});
  for(const sid in keep){ if(!G[sid]) continue; for(const k in keep[sid]) G[sid][k] = {...keep[sid][k]}; }
  for(const s of st){
    if(ctx.prevN[s.id] === 0 && !gget(G,s.id,1)) gset(G,n,s.id,1,{s:'A'});
    for(let d=1; d<n; d++){
      const c = gget(G,s.id,d);
      if(c?.s === 'N' && !gget(G,s.id,d+1)) gset(G,n,s.id,d+1,{s:'A'});
      if(c?.s === 'X' && slotOf(ctx.cfg, c.slot)?.nextAke && !gget(G,s.id,d+1)) gset(G,n,s.id,d+1,{s:'A'});
    }
    for(let d=1; d<=n; d++){
      if(gget(G,s.id,d)) continue;
      const r = reqOf(ctx.month, s.id, d);
      if(centerReq(r)) gset(G,n,s.id,d,{s:centerReq(r)});
      else if(onLeave(s, ctx.days[d-1].iso)) gset(G,n,s.id,d,{s:'L'});
    }
    // センターの直(平日の直・休日の当直)の翌日は休み
    if(ctx.prevCN?.[s.id] && !gget(G,s.id,1)) gset(G,n,s.id,1,{s:'O'});
    for(let d=1; d<n; d++){ if(isCenterNight(gget(G,s.id,d)?.s) && !gget(G,s.id,d+1)) gset(G,n,s.id,d+1,{s:'O'}); if((gget(G,s.id,d)?.s === 'IC' || gget(G,s.id,d)?.s === 'HK') && !gget(G,s.id,d+1)) gset(G,n,s.id,d+1,{s:'A'}); }
  }
  // 勉強会当番のうち5年目以下は、その日を日勤にする
  for(const dy of ctx.days){
    if(dy.hol || !ed(ctx, dy.d)) continue;
    for(const x of dy.st || []) for(const sid of (x.members || [])){
      const st = ctx.map[sid], y = yearsOf(st, dy.iso);
      if(!st || st.active === false || y == null || y > 5 || gget(G,sid,dy.d) || blocks(ctx,sid,dy.d,'D')) continue;

    }
  }

  const G2 = solveDuties(G, ctx, computeTargets(ctx)) || G;

  for(const t of tops) for(let k=0; k<DAY_TRY; k++){
    const H = clone(t.G); assignDayShifts(H, ctx);
    const sc = t.sc + dayScore(H, ctx);
    if(sc < bestSc){ bestSc = sc; best = H; }
  }

}

// ---------------- チェック(問題検出) ----------------
function cellIssuesFor(ctx, cells, sid){
  const s = ctx.map[sid], out = {}, row = cells[sid] || {};
  if(!s) return out;
  const lim = (+ctx.cfg.settings.minGap || 0) + 1;
  const add = (d,m) => { (out[d] = out[d] || []).push(m); };
  for(let d=1; d<=ctx.n; d++){
    const c = row[dk(d)], code = c?.s || '', r = reqOf(ctx.month, sid, d);
    if(centerReq(r)){ const want = centerReq(r); if(code !== want) add(d, centerLabel(want, ctx.days[d-1].hol) + 'の予定あり'); }
    if(code === 'M' && noMBefore(ctx, cells, sid, d)) add(d, '翌朝から休日の直・日直(前日の中勤は不可)');
    if(isCenterNight(code)){ const nx = d < ctx.n ? row[dk(d+1)]?.s : ctx.nextCell1?.[sid]?.s; if(nx && WORK.has(nx)) add(d, 'センター直の翌日は休み(勤務あり)'); }
    if(WORK.has(code) && (d === 1 ? ctx.prevCN?.[sid] : isCenterNight(row[dk(d-1)]?.s))) add(d, '前日がセンター直(この日は休み)');
    { const dy = ctx.days[d-1], y = yearsOf(s, dy.iso); if(!dy.hol && studyOn(ctx, sid, d) && y != null && y <= 5 && code !== 'D' && code !== '') add(d, '勉強会当番(5年目以下)は日勤に'); }
    if(code === 'X' && studyOn(ctx, sid, d)) add(d, '勉強会当番の日に外勤');
    if(code === 'X'){ const y = yearsOf(s, ctx.days[d-1].iso), mn = +ctx.cfg.settings.extMinYears || 0; if(y != null && y < mn) add(d, `外勤は${mn}年目以上`); }
    if(!WORK.has(code)) continue;
    if(!canDo(s, code)) add(d, '資格外の勤務');
    const b = blocks(ctx, sid, d, code, c); if(b) add(d, '希望・制限:' + b);
    if(c.dc && !canDC(s)) add(d, 'DC資格外');
    const nextAke = isNightN(code) || (code === 'X' && slotOf(ctx.cfg, c.slot)?.nextAke);
    if(nextAke){
      const r2 = nextReqOf(ctx, sid, d); if(r2?.noAke) add(d, '翌日が明け×'); if(r2?.am || r2?.pm) add(d, `翌日が${r2.am ? 'AM×' : 'PM×'}(明けにするなら要交渉)`); if(r2?.off) add(d, '翌日が終日×');
      if(centerReq(r2)) add(d, '翌日にセンター勤務');
      if(nextWeeklyOff(ctx, sid, d)) add(d, '翌日が不可・明け×の曜日(明けにできない)');
      if(studyOn(ctx, sid, d + 1)) add(d, '翌日が勉強会当番');
      const nx = d < ctx.n ? row[dk(d+1)]?.s : ctx.nextCell1?.[sid]?.s;
      if(nx && !['A','O','L'].includes(nx)) add(d, d < ctx.n ? '翌日(明け)に勤務あり' : '翌月1日(明け)に勤務あり');
    }
    if(code === 'N'){
      for(let k=d-lim; k<=d+lim && k<=ctx.n; k++) if(k >= 1 && k !== d && (k > d ? isNightN(row[dk(k)]?.s) : (row[dk(k)]?.s === 'IC' || row[dk(k)]?.s === 'HK'))) add(d, '直の間隔が短い(ICU・本館直を含む)');
      if(ctx.prevN[sid] >= d - lim) add(d, '前月末の直と近い');
      if(d > 1 && row[dk(d-1)]?.s === 'N') add(d, '明けの日に直');
    }
    if(code === 'E' && (d === 1 ? ctx.prevN[sid] === 0 : row[dk(d-1)]?.s === 'N')) add(d, '明けの日に早番');
  }
  return out;
}
function countIss(ctx, cells, sid){ return Object.values(cellIssuesFor(ctx, cells, sid)).reduce((t,a) => t + a.length, 0); }
function dayCounts(ctx, cells){
  const out = {};
  for(const day of ctx.days){
    const o = {N:0, E:0, Dint:0, M:0, DC:0, C3:0, Sr:0, half:0, vis:[], X:{}};
    const thr = +ctx.cfg.settings.seniorYears || 5;
    for(const s of ctx.staff){
      const c = cells[s.id]?.[dk(day.d)]; if(!c) continue;
      if(['E','N','D','M'].includes(c.s) && !c.c3 && (yearsOf(s, day.iso) ?? -1) >= thr) o.Sr++;   // 半休・3C当番は数えない
      if(isHalf(c.s)) o.half++; if(c.c3) o.C3++;
      if(c.s==='N') o.N++; if(c.s==='E') o.E++; if(c.s==='M') o.M++; if(c.dc) o.DC++;
      if(c.s==='D'){ if(isVisitor(s) && !c.cnt) o.vis.push(s.id); else o.Dint++; }
      if(c.s==='X') (o.X[c.slot] = o.X[c.slot] || []).push(s.id);
    }
    out[day.d] = o;
  }
  return out;
}
function analyze(ctx, cells){
  const cell = {}, day = {}, sug = {};
  for(const s of ctx.staff){ const x = cellIssuesFor(ctx, cells, s.id); if(Object.keys(x).length) cell[s.id] = x; }
  const dc = dayCounts(ctx, cells), set = ctx.cfg.settings, removed = ctx.month.removed || {};
  const minDay = +set.minDay || 0, maxMid = +set.maxMid || 0;
  for(const dy of ctx.days){
    const o = dc[dy.d], iss = [], sg = [];
    if(o.N === 0) iss.push('直なし'); if(o.N > 1) iss.push('直が複数');
    if(needsE(dy)){ if(o.E === 0) iss.push('早番なし'); if(o.E > 1) iss.push('早番が複数'); }
    if(!dy.hol){
      if(o.Dint < minDay){
        iss.push(`日勤${o.Dint}名(必要${minDay})`);
        o.vis.forEach(id => sg.push({type:'cnt', sid:id}));
        for(const [slot, ids] of Object.entries(o.X)){ const sl = slotOf(ctx.cfg, slot); if(sl && sl.priority !== 'must') sg.push({type:'rmx', key: slot + '_' + dk(dy.d), slot}); }
      }
      if(o.M > maxMid) iss.push(`中勤${o.M}名(上限${maxMid})`);
      if(o.M > 0 && o.Dint < minDay) iss.push('日勤不足なのに中勤あり');
      if(o.DC === 0) iss.push('DCなし'); if(o.DC > 1) iss.push('DCが複数');
      if(set.use3C !== false){ if(o.C3 === 0) iss.push('3Cなし'); if(o.C3 > 1) iss.push('3Cが複数'); }
    }
    for(const sl of (ctx.cfg.extSlots||[])){
      if(!slotOn(sl, dy) || removed[sl.id + '_' + dk(dy.d)]) continue;
      const have = (o.X[sl.id] || []).length;
      if(have < (+sl.count || 1)) iss.push(`${slotName(ctx.cfg, sl)} 未割当`);
    }
    if(iss.length) day[dy.d] = iss;
    if(sg.length) sug[dy.d] = sg;
  }
  return {cell, day, sug};
}

// ---------------- 候補・入れ替え ----------------
function fallbackCell(ctx, sid, d, prev){
  const dy = ctx.days[d-1]; if(!dy || dy.hol) return null;
  const k = prev && ['D','M'].includes(prev.s) ? {s:prev.s} : {s:'D'};
  return blocks(ctx, sid, d, k.s) ? null : k;
}
function applyReplace(ctx, cells, from, to, d, code){
  const n = ctx.n, C = clone(cells);
  const toOld = gget(C,to,d), toOldNext = d < n ? gget(C,to,d+1) : null;
  if(code === 'N'){
    gset(C,n,to,d,{s:'N'}); if(d < n) gset(C,n,to,d+1,{s:'A'});
    if(from){ gset(C,n,from,d,fallbackCell(ctx,from,d,toOld)); if(d < n && gget(C,from,d+1)?.s === 'A') gset(C,n,from,d+1,fallbackCell(ctx,from,d+1,toOldNext)); }
  } else {
    gset(C,n,to,d,{s:'E'});
    if(from) gset(C,n,from,d,fallbackCell(ctx,from,d,toOld));
  }
  return C;
}
function dutyCandidates(ctx, cells, d, code, holder){
  const out = [], okOld = c => !c || (['D','M','O'].includes(c.s) && !c.lock);
  const tg = computeTargets(ctx);
  for(const s of ctx.staff){
    if(s.id === holder || !canDo(s, code)) continue;
    const old = gget(cells, s.id, d); if(!okOld(old)) continue;
    if(code === 'N' && d < ctx.n){ const nx = gget(cells, s.id, d+1); if(!okOld(nx) && nx?.s !== 'A') continue; }
    if(code === 'E' && !needsE(ctx.days[d-1])) continue;
    const before = countIss(ctx, cells, s.id);
    const C = applyReplace(ctx, cells, holder, s.id, d, code);
    if(countIss(ctx, C, s.id) > before) continue;
    let cnt = 0; for(let k=1; k<=ctx.n; k++) if(gget(cells, s.id, k)?.s === code) cnt++;
    const t = code === 'N' ? tg.T[s.id] : tg.TE[s.id];
    out.push({sid:s.id, cnt, t, k: cnt - (t || 0), old});
  }
  return out.sort((a,b) => a.k - b.k);
}
function swapRows(ctx, cells, a, b, ds){
  const C = clone(cells);
  for(const x of ds){ const ca = gget(cells,a,x), cb = gget(cells,b,x); gset(C,ctx.n,a,x,cb ? {...cb} : null); gset(C,ctx.n,b,x,ca ? {...ca} : null); }
  return C;
}
// pの直(d)とqの直(e)を入れ替える。押し出された勤務は希望に反しない形(日勤/中勤/休み)に置き換える
function applyDutySwap(ctx, cells, p, q, d, e){
  const n = ctx.n, C = clone(cells);
  const pE = gget(cells,p,e), pE1 = gget(cells,p,e+1), qD = gget(cells,q,d), qD1 = gget(cells,q,d+1);
  gset(C,n,p,d,fallbackCell(ctx,p,d,qD));
  if(d < n && gget(cells,p,d+1)?.s === 'A') gset(C,n,p,d+1,fallbackCell(ctx,p,d+1,qD1));
  gset(C,n,q,e,fallbackCell(ctx,q,e,pE));
  if(e < n && gget(cells,q,e+1)?.s === 'A') gset(C,n,q,e+1,fallbackCell(ctx,q,e+1,pE1));
  gset(C,n,p,e,{s:'N'}); if(e < n) gset(C,n,p,e+1,{s:'A'});
  gset(C,n,q,d,{s:'N'}); if(d < n) gset(C,n,q,d+1,{s:'A'});
  return C;
}
function dutySwaps(ctx, cells, p, d){
  const out = [], n = ctx.n, base_p = countIss(ctx, cells, p), bad = c => c && (c.lock || ['X',...CENTER_CODES,'L','N','E'].includes(c.s));
  for(const q of ctx.staff){
    if(q.id === p || !canDo(q,'N')) continue;
    const base_q = countIss(ctx, cells, q.id);
    for(let e=1; e<=n; e++){
      if(gget(cells, q.id, e)?.s !== 'N' || Math.abs(e-d) <= 1) continue;
      if([gget(cells,p,e), e<n ? gget(cells,p,e+1) : null, gget(cells,q.id,d), d<n ? gget(cells,q.id,d+1) : null].some(bad)) continue;
      const C = applyDutySwap(ctx, cells, p, q.id, d, e);
      const ap = countIss(ctx, C, p), aq = countIss(ctx, C, q.id);
      if(ap > base_p || aq > base_q) continue;
      out.push({q:q.id, e, gain:(base_p + base_q) - (ap + aq)});
    }
  }
  return out.sort((a,b) => b.gain - a.gain).slice(0, 10);
}

  S.user = {...st, admin: !!st.admin && S.amode === 'adjust', isAdminReal: !!st.admin};
}
function renderShell(){
  if(S.cfg === undefined) return '<div class="card" style="margin:40px auto;max-width:400px">読み込み中…</div>';
  if(S.cfg === null) return viewSetup();
  if(!S.user) return viewLogin();
  const admin = !!S.user.admin;
  const tabs = admin
    ? [['roster','勤務表作成'],['calendar','全体カレンダー'],['requests','希望入力'],['center','センター・ICU・本館'],['swaps','交代申請'],['staff','スタッフ'],['ext','外勤'],['settings','休日・設定'],['study','勉強会'],['lists','リスト出力'],['history','版・履歴'],['notices','お知らせ'],['pin','PIN変更']]
    : [...(isClerk(S.user) ? [['view','勤務表']] : [['mine','勤務表'],['requests','希望入力'],['swaps','交代申請']]),
       ...(can(S.user,'roster') ? [['roster','勤務の変更'], ['center','センター・ICU・本館']] : []), ...(can(S.user,'study') || can(S.user,'events') ? [['study','勉強会・予定']] : []),
       ...(can(S.user,'lists') ? [['lists','リスト出力']] : []), ['notices','お知らせ'], ['pin','PIN変更']];
  if(!S.tab || !tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];

  let h = `<header class="${admin ? 'adjmode' : ''}"><h1>救急科 勤務表${admin ? '<span class="adjtag">調整モード</span>' : ''}</h1>
    <button class="btn sm" onclick="App.month(-1)">‹</button><b style="font-size:15px">${y}年${m}月</b><button class="btn sm" onclick="App.month(1)">›</button>
    <span class="sp"></span>${S.user.isAdminReal ? `<span class="modesw"><button class="${admin ? '' : 'on'}" onclick="App.setMode('self')">自分の予定</button><button class="${admin ? 'on adj' : ''}" onclick="App.setMode('adjust')">調整モード</button></span>` : ''}<span>${esc(S.user.name)}</span>
    <button class="btn sm" onclick="App.logout()">ログアウト</button></header>
    <nav class="tabs">${tabs.map(([k,l]) => `<button class="${S.tab===k?'on':''}" onclick="App.tab('${k}')">${l}${k==='notices'&&ur?`<span class="badge">${ur}</span>`:''}${k==='swaps'&&sb?`<span class="badge">${sb}</span>`:''}</button>`).join('')}</nav><main>`;
  h += boardBanner();
  if(S.month === undefined) h += '<div class="card">読み込み中…</div>';
  else {
    try {
      h += ({roster:viewRoster, mine:viewMine, requests:viewRequests, swaps:viewSwaps, staff:viewStaff, ext:viewExt, settings:viewSettings, history:viewHistory, lists:viewLists, study:viewStudy, view:viewClerk, center:viewCenter, calendar:viewCalendar, notices:viewNotices, pin:viewPin})[S.tab]();
    } catch(e){ console.error(e); h += `<div class="card">表示エラー: ${esc(e.message)}</div>`; }
  }
  return h + '</main>';
}

function gridHTML(ctx, cells, opt){
  const days = ctx.days, st = ctx.staff;
  let h = `<div class="gridwrap${!opt.readonly && S.lockMode ? ' lockmode' : ''}"><table class="grid"><thead><tr><th class="name">氏名</th>`;
  for(const dy of days) h += `<th class="${dy.hol?'hol':''} ${dy.ext?'extd':''}" title="${esc(dy.holName)}${dy.ext?'(翌月)':''}${dy.ev ? ' 📌' + esc(dy.ev) : ''}${(dy.st||[]).map(x => ' 📚' + esc(studyText(ctx.cfg, x))).join('')}"${opt.readonly ? '' : ` style="cursor:pointer" onclick="App.headClick(${dy.d})"`}>${dy.ext ? md(dy.d) : dy.d}<br>${WD[dy.wd]}${dy.split ? '<br><span style="font-size:9px">早遅</span>' : ''}${dy.ev || (dy.st||[]).length ? `<br><span class="evm">${dy.ev ? '📌' : ''}${(dy.st||[]).length ? '📚' : ''}</span>` : ''}</th>`;
  const SP = ctx.special || [];
  h += '<th>直</th><th>ICU</th><th>本館</th><th>土日<br>祝直</th><th>早</th><th>日</th><th>中</th><th>DC</th><th>外</th>' + (opt.tg ? '<th>直<br>目標</th>' : '') + SP.map(sp => `<th title="${esc(sp.from)}〜${esc(sp.to)}の直(早遅分割の日は早番も含む・他の月の分を含む)">${esc(sp.name.slice(0,4))}<br>直</th>`).join('') + '</tr></thead><tbody>';
  for(const s of st){
    const row = cells[s.id] || {}, cnt = {N:0,NH:0,E:0,D:0,M:0,DC:0,X:0};
    h += `<tr class="${opt.highlight===s.id?'me':''}"><td class="name"${opt.readonly ? '' : ` style="cursor:pointer" title="${s.licenseYear ? yearsOf(s, ctx.days[0].iso) + '年目 / ' : ''}押すとこの人の固定をまとめて設定" onclick="App.nameClick('${s.id}')"`}>${TYPE_S[s.type]||''} ${esc(s.name)}${s.licenseYear ? `<span class="muted" style="font-size:10px"> ${yearsOf(s, ctx.days[0].iso)}年目</span>` : ''}</td>`;
    for(const dy of days){
      const d = dy.d, c = row[dk(d)], code = c?.s || '';
      if(code==='N'){ cnt.N++; if(dy.hol) cnt.NH++; } if(code==='IC' || code==='ICD') cnt.IC = (cnt.IC || 0) + 1; if(code==='HK' || code==='HKD') cnt.HK = (cnt.HK || 0) + 1; if(code==='E') cnt.E++; if(code==='D') cnt.D++; if(code==='M') cnt.M++; if(c?.dc) cnt.DC++; if(code==='X') cnt.X++;
      const cls = ['cell']; if(opt.readonly) cls.push('ro');
      if(code && SH[code]) cls.push(SH[code].c); else if(dy.hol) cls.push('holcol');
      if(isVisitor(s) && code === 'D' && !c.cnt) cls.push('vis');
      const iss = opt.issues?.[s.id]?.[d]; if(iss) cls.push('issue');
      if(opt.cmp && !dy.ext && diffCell(opt.cmp[s.id]?.[dk(d)], c)) cls.push('changed');
      if(dy.ext) cls.push('extc');
      let tip = `${s.name} ${md(d)}(${WD[dy.wd]}) ${cellName(c, ctx.cfg)}`;
      let inner = `<span class="lb">${esc(isCenter(code) ? shortLab(code, dy.hol) : cellLabel(c, ctx.cfg))}</span>`;
      if(opt.showReq){ const rw = reqOf(ctx.month, s.id, d)?.want; if(rw) inner += `<span class="wm" title="希望:${WANT[rw]}">希${({E:'早',D:'日',M:'中',N:'夜'})[rw]}</span>`; }
      if(c?.dc) inner += '<span class="dcb">DC</span>';
      if(c?.c3) inner += '<span class="c3b">3C</span>';
      if(c?.lock) inner += '<span class="lock">🔒</span>'; else if(c?.cnt) inner += '<span class="lock">算</span>';
      if(opt.showReq){ const r = reqOf(ctx.month, s.id, d); if(r){ const mk = reqMark(r); if(mk) inner += `<span class="rq ${r.late?'late':''}">${esc(mk)}</span>`; tip += ' / 希望:' + reqText(r); } }
      if(iss) tip += ' / 問題:' + iss.join('、');
      h += `<td class="${cls.join(' ')}" title="${esc(tip)}"${opt.readonly ? '' : ` onclick="App.cellClick('${s.id}',${d})"`}>${inner}</td>`;
    }
    h += `<td class="sum">${cnt.N}</td><td class="sum">${cnt.IC || 0}</td><td class="sum">${cnt.HK || 0}</td><td class="sum">${cnt.NH}</td><td class="sum">${cnt.E}</td><td class="sum">${cnt.D}</td><td class="sum">${cnt.M}</td><td class="sum">${cnt.DC}</td><td class="sum">${cnt.X}</td>`;
    if(opt.tg) h += `<td class="sum">${opt.tg.T[s.id] != null ? opt.tg.T[s.id].toFixed(1) : '-'}</td>`;
    SP.forEach((sp,i) => { let c = sp.base[s.id] || 0; for(const d of sp.days){ const x = row[dk(d)]?.s; if(x === 'N' || (x === 'E' && ctx.days[d-1].split)) c++; } const t = opt.tg?.TS?.[i]?.[s.id]; h += `<td class="sum" title="目標 ${t != null ? t.toFixed(1) : '-'}">${c}${t != null ? `<span class="muted">/${t.toFixed(1)}</span>` : ''}</td>`; });
    h += '</tr>';
  }
  const dc = dayCounts(ctx, cells), set = ctx.cfg.settings;
  const rows = [['直','N'],['早','E'],['日勤(院内)','Dint'],['中勤','M'],['DC','DC'], ...(set.use3C !== false ? [['3C','C3']] : []), [`${+set.seniorYears || 5}年目以上`,'Sr']];
  for(const [lab,key] of rows){
    h += `<tr class="dayrow"><td class="name">${lab}</td>`;
    for(const dy of days){
      const o = dc[dy.d], v = o[key];
      if(dy.hol && key !== 'N' && key !== 'Sr' && !(key === 'E' && dy.split)){ h += '<td></td>'; continue; }
      let bad = false;
      if(key==='N' || key==='E' || key==='DC' || key==='C3') bad = v !== 1;
      if(key==='Dint') bad = v < (+set.minDay||0);
      if(key==='M') bad = v > (+set.maxMid||0);
      h += `<td class="${bad?'bad':''}"${opt.readonly ? '' : ` style="cursor:pointer" onclick="App.openDay(${dy.d})"`}>${v}${key==='Dint' && o.vis.length ? `<span class="muted">+${o.vis.length}</span>` : ''}${key==='Dint' && o.half ? `<span class="muted" title="半休">+半${o.half}</span>` : ''}</td>`;
    }
    h += `<td colspan="${(opt.tg ? 10 : 9) + SP.length}"></td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function viewRoster(){
  const ctx = makeCtx(), m = ctx.month, cells = m.cells || {};
  const an = analyze(ctx, cells), tg = computeTargets(ctx);
  const conf = m.confirmed || 0, vers = m.versions || {};
  const cmpN = S.compareV === undefined ? (conf || null) : S.compareV;
  const cmp = cmpN ? vers['v' + cmpN]?.cells : null;
  const pend = conf ? diffCells(vers['v' + conf]?.cells || {}, S.month.cells || {}).length : null;
  const nm1 = +shiftYm(S.ym,1).slice(5);
  const vnums = Object.keys(vers).map(k => +k.slice(1)).sort((a,b) => b - a);
  const empty = !Object.keys(cells).length;
  let h = `<div class="card noprint"><div class="row">
    ${S.user.admin ? `<button class="btn pri" onclick="App.ask('勤務表を自動作成します。🔒のマス以外はすべて組み直します。よろしいですか?','genAll')">自動作成(全体)</button>
    <button class="btn" onclick="App.ask('問題がある日の前後2日だけを組み直します。ほかの日は変えません。','genPartial')"${empty?' disabled':''}>問題日の前後だけ組み直し</button>
    <button class="btn pri" onclick="App.ask('いまの勤務表を第${conf+1}版として確定し、スタッフに配信します。変更があった人にはお知らせが届きます。','confirmVersion')"${empty?' disabled':''}>確定して配信(第${conf+1}版)</button>` : '<span class="muted">勤務の変更入力ができます(自動作成・配信は調整役が行います)。</span>'}
    <span class="muted">${conf ? `配信済み:第${conf}版/未配信の変更:${pend}件` : 'まだ配信していません'}</span>
    <span class="sp"></span>
    <label class="muted">比較する版 <select onchange="App.setCompare(this.value)"><option value="">なし</option>${vnums.map(v => `<option value="${v}" ${cmpN===v?'selected':''}>第${v}版</option>`).join('')}</select></label>
    <button class="btn ${S.lockMode ? 'pri' : ''}" onclick="App.toggleLockMode()">🔒 固定モード:${S.lockMode ? 'ON' : 'OFF'}</button>
    <button class="btn" onclick="App.ask('勤務表のすべての固定(🔒)を解除します。','lockMany',null,null,false)">固定をすべて解除</button>
    <button class="btn" onclick="window.print()">印刷</button><button class="btn" onclick="App.csv()">Excel(CSV)</button></div>
    <div class="row" style="margin-top:6px">${S.user.admin ? '' : '<!--'}<label class="muted">翌月(${nm1}月)の最初 <input type="number" min="0" max="10" value="${ctx.ext}" onchange="App.setExtend(this.value)" style="width:56px"> 日も一緒に作る</label>${S.user.admin ? '' : '-->'}
    ${ctx.ext ? `<span class="muted">→ ${nm1}/1〜${nm1}/${ctx.ext} は${nm1}月の勤務表(下書き)に入ります。配信は${nm1}月の勤務表として行います。</span>` : ''}
    ${ctx.prevExt ? `<span class="notice" style="margin:0;padding:3px 8px">${+S.ym.slice(5)}/1〜${ctx.prevExt}は前月の勤務表と一緒に作成済みです。「自動作成(全体)」でもこの日は変わりません。</span>` : ''}</div>
    <div style="margin-top:6px">${legendHTML()}</div>
    ${S.lockMode ? '<div class="notice" style="margin:6px 0 0">固定モード中:マスを押すと固定/解除が切り替わります。日付を押すとその日全員、名前を押すとその人の全日をまとめて固定/解除します。終わったら「固定モード:ON」を押して戻してください。</div>' : ''}
    <p class="muted" style="margin:4px 0 0">マスを押すと勤務の変更・固定・候補の表示ができます。日付や下の集計行を押すとその日の一覧と候補、名前を押すとその人の固定をまとめて設定できます。</p></div>`;
  // チェック結果
  const dKeys = Object.keys(an.day).map(Number).sort((a,b) => a-b);
  const cl = []; for(const sid in an.cell) for(const d in an.cell[sid]) cl.push({sid, d:+d, msg:an.cell[sid][d]});
  cl.sort((a,b) => a.d - b.d);
  const late = []; for(const sid in (m.requests||{})) for(const k in m.requests[sid]){ const r = m.requests[sid][k]; if(r.late && ctx.map[sid]) late.push({sid, d:+k.slice(1), r}); }
  late.sort((a,b) => a.d - b.d);
  if(!empty){
    h += `<div class="card noprint"><h3>チェック結果 ${dKeys.length + cl.length === 0 ? '<span class="ok">問題なし</span>' : `<span style="color:#d23b3b">${dKeys.length + cl.length}件</span>`}</h3>`;
    if(dKeys.length + cl.length) h += '<ul class="issues">';
    for(const d of dKeys){
      const dy = ctx.days[d-1];
      h += `<li><b>${md(d)}(${WD[dy.wd]})</b> ${esc(an.day[d].join('、'))} <button class="btn sm" onclick="App.openDay(${d})">候補を見る</button>`;
      for(const sg of (an.sug[d] || [])){
        if(sg.type === 'cnt') h += ` <button class="btn sm" onclick="App.countVisitor('${sg.sid}',${d})">${esc(ctx.map[sg.sid].name)}を日勤に算入</button>`;
        if(sg.type === 'rmx') h += ` <button class="btn sm dan" onclick="App.ask('${esc(slotName(ctx.cfg, slotOf(ctx.cfg, sg.slot)))}(${md(d)})を外して、この日の前後を組み直します。','removeExt','${sg.key}',${d})">${esc(slotName(ctx.cfg, slotOf(ctx.cfg, sg.slot)))}を外す</button>`;
      }
      h += '</li>';
    }
    for(const x of cl) h += `<li>${esc(ctx.map[x.sid].name)} ${md(x.d)}:${esc(x.msg.join('、'))} <button class="btn sm" onclick="App.openCell('${x.sid}',${x.d})">開く</button></li>`;
    if(dKeys.length + cl.length) h += '</ul>';
    const tgW = computeTargets(ctx);
    const miss = []; const ok = (w, c) => w === 'E' ? c === 'E' : w === 'D' ? ['D','DA','DP'].includes(c) : w === 'M' ? (c === 'M' || c === 'DA') : w === 'N' ? c === 'N' : true;
    for(const sid in (m.requests || {})) for(const k in m.requests[sid]){ const w = m.requests[sid][k]?.want, d = +k.slice(1); if(!w || !ctx.map[sid] || d > ctx.n0) continue; const c = gget(cells, sid, d)?.s || ''; if(!ok(w, c)) miss.push({sid, d, w, c, why:wantReason(ctx, cells, tgW, sid, d, w)}); }
    miss.sort((a,b) => a.d - b.d);
    { const nW = Object.values(m.requests || {}).reduce((t, o) => t + Object.values(o).filter(x => x?.want).length, 0);
      if(nW) h += `<div class="muted" style="margin-top:8px">勤務の希望:${nW}件中 ${nW - miss.length}件が通っています。${miss.length ? `<details style="display:inline"><summary style="display:inline;cursor:pointer;color:#1f5fbf">通らなかった${miss.length}件</summary>${miss.map(x => `<div>${esc(ctx.map[x.sid].name)} ${md(x.d)}:${WANT[x.w]}希望 → ${esc(cellName(gget(cells, x.sid, x.d), ctx.cfg))}${x.why ? ` <span style="color:#a0522d">(理由:${esc(x.why)})</span>` : ''} <button class="btn sm" onclick="App.openCell('${x.sid}',${x.d})">開く</button></div>`).join('')}</details>` : ''}</div>`; }
    if(late.length) h += `<div class="notice" style="margin-top:8px"><b>追加希望(締切後または配信後に入った希望)</b><br>${late.map(x => `${esc(ctx.map[x.sid].name)} ${md(x.d)}:${esc(reqText(x.r))}`).join('<br>')}</div>`;
    h += '</div>';
  } else {
    h += '<div class="card noprint">まだ勤務表がありません。「自動作成(全体)」を押してください。先にスタッフ・外勤・休日の設定と、各自の希望入力を済ませておくと確実です。</div>';
  }
  h += eventsHTML(ctx, true);
  const [y,mm] = S.ym.split('-').map(Number);
  h += `<div class="printonly"><b>救急科 勤務表 ${y}年${mm}月</b>${conf ? ` 第${conf}版` : '(下書き)'}</div>`;
  h += gridHTML(ctx, cells, {issues:an.cell, cmp, showReq:true, tg});
  return h;
}

function viewMine(){
  const ctx = makeCtx({noExt:true}), m = ctx.month, conf = m.confirmed, me = S.user.id;
  let h = '';
  const ur = unreadCount(); if(ur) h += `<div class="notice">新しいお知らせが${ur}件あります。<button class="btn sm" onclick="App.tab('notices')">見る</button></div>`;
  if(!conf) return h + eventsHTML(ctx, false) + '<div class="card">この月の勤務表はまだ配信されていません。「希望入力」から希望を入れてください。</div>';
  const cells = m.versions['v' + conf].cells || {};
  const mine = ctx.days.map(dy => ({dy, c:gget(cells, me, dy.d)})).filter(x => x.c && x.c.s);
  h += `<div class="card"><h3>あなたの勤務(第${conf}版 ${fmtTs(m.versions['v'+conf].ts)}配信)</h3><div class="row" style="gap:4px 14px">${mine.map(x => `<span>${md(x.dy.d)}(${WD[x.dy.wd]}) <b>${esc(cellName(x.c, ctx.cfg))}</b></span>`).join('') || 'なし'}</div></div>`;
  h += `<div class="card noprint">${legendHTML()}<div class="row" style="margin-top:6px"><button class="btn" onclick="window.print()">印刷</button></div></div>`;
  const [y,mm] = S.ym.split('-').map(Number);
  h += eventsHTML(ctx, false);
  h += `<div class="printonly"><b>救急科 勤務表 ${y}年${mm}月 第${conf}版</b></div>`;
  return h + gridHTML(ctx, cells, {readonly:true, highlight:me});
}

function eventsHTML(ctx, admin){

const SW_ST = {pending:'相手の承諾待ち', accepted:'調整役の承認待ち', approved:'承認済み', rejected:'却下', declined:'相手が辞退', cancelled:'取り消し'};
function swapDays(cells, x, n){
  const ds = new Set([x.d]); const c1 = gget(cells, x.from, x.d), c2 = gget(cells, x.to, x.d);
  if((c1?.s === 'N' || c2?.s === 'N') && x.d < n) ds.add(x.d + 1);
  if(x.e){ ds.add(x.e); const c3 = gget(cells, x.from, x.e), c4 = gget(cells, x.to, x.e); if((c3?.s === 'N' || c4?.s === 'N') && x.e < n) ds.add(x.e + 1); }
  return [...ds];
}
function viewSwaps(){
  const ctx = makeCtx({noExt:true}), m = ctx.month, me = S.user.id, conf = m.confirmed;
  const cells = conf ? (m.versions['v'+conf].cells || {}) : null;
  const sw = Object.entries(m.swaps || {}).map(([id,x]) => ({id, ...x})).sort((a,b) => b.ts - a.ts);
  const nm = id => esc(ctx.map[id]?.name || '?');
  const desc = x => `${nm(x.from)}の${md(x.d)}(${esc(cellName(gget(cells||{}, x.from, x.d), ctx.cfg))}) ${x.e ? `⇔ ${nm(x.to)}の${md(x.e)}(${esc(cellName(gget(cells||{}, x.to, x.e), ctx.cfg))})` : `→ ${nm(x.to)}が代わる`}${x.note ? ` 「${esc(x.note)}」` : ''}`;
  let h = '<div class="card"><h3>交代を申請する</h3>';
  if(!cells) h += '<p class="muted">勤務表が配信されてから申請できます。</p>';
  else {
    const f = S.swf;
    const myDays = ctx.days.filter(dy => WORK.has(gget(cells, me, dy.d)?.s || ''));
    const others = ctx.staff.filter(s => s.id !== me);
    const tDays = f.to ? ctx.days.filter(dy => WORK.has(gget(cells, f.to, dy.d)?.s || '')) : [];
    h += `<div class="row"><label>自分の日 <select onchange="App.swf('d',this.value)"><option value="">選択</option>${myDays.map(dy => `<option value="${dy.d}" ${+f.d===dy.d?'selected':''}>${md(dy.d)}(${WD[dy.wd]}) ${esc(cellName(gget(cells,me,dy.d), ctx.cfg))}</option>`).join('')}</select></label>
      <label>相手 <select onchange="App.swf('to',this.value)"><option value="">選択</option>${others.map(s => `<option value="${s.id}" ${f.to===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label>種類 <select onchange="App.swf('type',this.value)"><option value="cover" ${f.type!=='swap'?'selected':''}>同じ日で入れ替え</option><option value="swap" ${f.type==='swap'?'selected':''}>相手の日と交換</option></select></label>
      ${f.type === 'swap' ? `<label>相手の日 <select onchange="App.swf('e',this.value)"><option value="">選択</option>${tDays.map(dy => `<option value="${dy.d}" ${+f.e===dy.d?'selected':''}>${md(dy.d)}(${WD[dy.wd]}) ${esc(cellName(gget(cells,f.to,dy.d), ctx.cfg))}</option>`).join('')}</select></label>` : ''}
      <input placeholder="ひとこと(任意)" id="swnote" style="width:180px"><button class="btn pri" onclick="App.swapSubmit()">申請</button></div>
      <p class="muted">「同じ日で入れ替え」は、その日の自分と相手の勤務を入れ替えます(相手が休みなら自分が休みになります)。直の場合は翌日の明けも一緒に入れ替えます。相手が承諾したあと、調整役が承認すると勤務表に反映されて配信されます。</p>`;
  }
  h += '</div>';
  const toMe = sw.filter(x => x.to === me && x.status === 'pending');
  if(toMe.length) h += `<div class="card"><h3>あなた宛ての申請</h3><table class="list">${toMe.map(x => `<tr><td>${desc(x)}</td><td><button class="btn sm pri" onclick="App.swapRespond('${x.id}',true)">承諾</button> <button class="btn sm" onclick="App.swapRespond('${x.id}',false)">辞退</button></td></tr>`).join('')}</table></div>`;
  if(S.user.admin){
    const acc = sw.filter(x => x.status === 'accepted');
    h += '<div class="card"><h3>承認待ち(調整役)</h3>';
    if(!acc.length) h += '<p class="muted">ありません。</p>';
    else {
      const draft = m.cells || {};
      h += `<p class="muted">承認すると下書きに反映し、新しい版として配信します(下書きにある未配信の変更も一緒に配信されます)。</p><table class="list">`;
      for(const x of acc){
        const ds = swapDays(draft, x, ctx.n); const C = swapRows(ctx, draft, x.from, x.to, ds);
        const before = countIss(ctx, draft, x.from) + countIss(ctx, draft, x.to), after = countIss(ctx, C, x.from) + countIss(ctx, C, x.to);
        h += `<tr><td>${desc(x)}${after > before ? `<div style="color:#d23b3b">注意:承認すると問題が${after-before}件増えます</div>` : '<div class="ok">問題は増えません</div>'}</td><td style="white-space:nowrap"><button class="btn sm pri" onclick="App.swapApprove('${x.id}',true)">承認</button> <button class="btn sm dan" onclick="App.swapApprove('${x.id}',false)">却下</button></td></tr>`;
      }
      h += '</table>';
    }
    h += '</div>';
  }
  const list = S.user.admin ? sw : sw.filter(x => x.from === me || x.to === me);
  h += `<div class="card"><h3>申請の一覧</h3>${list.length ? `<table class="list"><tr><th>日時</th><th>内容</th><th>状態</th><th></th></tr>${list.map(x => `<tr><td>${fmtTs(x.ts)}</td><td>${desc(x)}</td><td>${SW_ST[x.status]||x.status}</td><td>${x.from===me && (x.status==='pending'||x.status==='accepted') ? `<button class="btn sm" onclick="App.swapCancel('${x.id}')">取り消し</button>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted">ありません。</p>'}</div>`;
  return h;
}

// 管理者用:日勤に入っている上級医(◯年目以上)の一覧。早番・遅番(直)・中勤は含めない
function seniorRows(ctx, cells){
  const thr = +ctx.cfg.settings.seniorYears || 5;
  return ctx.days.map(dy => {
    const list = ctx.staff.filter(s => { const c = gget(cells, s.id, dy.d); return c?.s === 'D' && !c.c3 && (yearsOf(s, dy.iso) ?? -1) >= thr; })
      .map(s => ({s, y:yearsOf(s, dy.iso), dc:!!gget(cells, s.id, dy.d)?.dc}))
      .sort((a,b) => b.y - a.y);
    return {dy, list};
  });
}
const LIST_TYPES = {duty:'早番・遅番(救急科直)', c3:'3C当番', mid:'中勤', senior:'日勤の上級医', study:'勉強会当番'};
function listData(ctx, cells, type){
  const nm = s => s.name, yr = (s, dy) => yearsOf(s, dy.iso);
  const who = (dy, f) => ctx.staff.filter(s => f(gget(cells, s.id, dy.d), s));
  const thr = +ctx.cfg.settings.seniorYears || 5;
  const head = {duty:['日付','早番','遅番・直'], c3:['日付','3C当番'], mid:['日付','中勤'], senior:['日付','人数',`日勤の${thr}年目以上(年目)`], study:['日付','勉強会','当番']}[type];
  const rows = [], tally = {};
  const count = arr => arr.forEach(s => tally[s.id] = (tally[s.id] || 0) + 1);
  for(const dy of ctx.days){
    const date = `${md(dy.d)}(${WD[dy.wd]})`;
    if(type === 'duty'){ const e = who(dy, c => c?.s === 'E'), n = who(dy, c => c?.s === 'N'); count(e); count(n); rows.push({dy, cols:[date, e.map(nm).join('、') || (needsE(dy) ? '—' : ''), n.map(nm).join('、') + (dy.hol && !dy.split ? '(土日祝の直)' : '')]}); }
    if(type === 'c3'){ if(dy.hol) continue; const a = who(dy, c => c?.c3); count(a); rows.push({dy, cols:[date, a.map(s => `${nm(s)}${yr(s,dy) != null ? `(${yr(s,dy)}年目)` : ''}`).join('、') || '—']}); }
    if(type === 'mid'){ if(dy.hol) continue; const a = who(dy, c => c?.s === 'M'); count(a); rows.push({dy, cols:[date, a.map(nm).join('、') || '—']}); }
    if(type === 'senior'){ if(dy.hol){ rows.push({dy, cols:[date, '—', `${dy.holName || '休日'}(日勤なし)`]}); continue; } const a = who(dy, (c, s) => c?.s === 'D' && !c.c3 && (yr(s,dy) ?? -1) >= thr).sort((p,q) => yr(q,dy) - yr(p,dy)); count(a); rows.push({dy, cols:[date, String(a.length), a.map(s => `${nm(s)}(${yr(s,dy)})${gget(cells,s.id,dy.d)?.dc ? '・DC' : ''}`).join('、') || 'なし']}); }
    if(type === 'study'){ for(const x of dy.st || []){ const ms = (x.members||[]).map(id => ctx.map[id]).filter(Boolean); count(ms); rows.push({dy, cols:[date, x.type + (x.note ? ' ' + x.note : ''), ms.map(nm).join('、') || '—']}); } }
  }
  return {head, rows, tally};
}

function viewHistory(){
  const m = S.month || {}, vers = Object.entries(m.versions || {}).map(([k,v]) => ({n:+k.slice(1), ...v})).sort((a,b) => b.n - a.n);

  return h;

function modalHTML(){
  const t = S.modal.type;
  if(t === 'ask') return `<p style="white-space:pre-wrap">${esc(S.modal.text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="App.closeModal()">キャンセル</button><button class="btn pri" onclick="App.doAsk()">実行</button></div>`;
  if(t === 'cell') return modalCell();
  if(t === 'day') return modalDay();
  if(t === 'row') return modalRow();
  if(t === 'reqday') return modalReqDay();
  if(t === 'calday') return modalCalDay();
  if(t === 'staff') return modalStaff();
  if(t === 'slot') return modalSlot();
  return '';
}
function candHTML(ctx, cells, d, code, holder){
  const nm = id => esc(ctx.map[id]?.name || '?');
  const list = dutyCandidates(ctx, cells, d, code, holder).slice(0, 10);
  let h = `<h4>${code === 'N' ? '救急科直' : '早番'}に入れる人${holder ? `(${nm(holder)}と交代)` : ''}</h4>`;
  if(!list.length) h += '<p class="muted">条件を満たす人がいません。</p>';
  else h += `<table class="list"><tr><th>氏名</th><th>今月の回数/目標</th><th>その日の勤務</th><th></th></tr>${list.map(x => `<tr><td>${nm(x.sid)}</td><td>${x.cnt} / ${x.t != null ? x.t.toFixed(1) : '-'}</td><td>${esc(cellName(x.old, ctx.cfg))}</td><td><button class="btn sm pri" onclick="App.replaceDuty('${holder||''}','${x.sid}',${d},'${code}')">${holder ? '交代する' : '割り当てる'}</button></td></tr>`).join('')}</table>`;
  if(holder && code === 'N'){
    const sw = dutySwaps(ctx, cells, holder, d);
    h += `<h4>直の日を交換する案(${nm(holder)}の${md(d)} ⇔ 相手の直の日)</h4>`;
    if(!sw.length) h += '<p class="muted">問題を増やさずに交換できる案がありません。</p>';
    else h += `<table class="list">${sw.map(x => `<tr><td>${nm(x.q)}の${md(x.e)}(${WD[ctx.days[x.e-1].wd]})と交換${x.gain > 0 ? ` <span class="ok">問題が${x.gain}件減る</span>` : ''}</td><td><button class="btn sm pri" onclick="App.swapDuty('${holder}','${x.q}',${d},${x.e})">交換する</button></td></tr>`).join('')}</table>`;
  }
  return h;
}

  }
  const nh = by('N');
  h += candHTML(ctx, cells, d, 'N', nh[0]?.id || '');

  return h;

// ---------------- 操作 ----------------
async function patchYm(ym, patch){ try { await S.store.patch('months/' + ym, patch); } catch(e){ console.error(e); toast('保存に失敗しました: ' + (e.code||e.message)); } }
async function commit(changes, text){
  const n0 = daysIn(S.ym), patch = {}, p2 = {};
  for(const ch of changes){ if(ch.d > n0) p2[`cells.${ch.sid}.${dk(ch.d - n0)}`] = cleanCell(ch.cell); else patch[`cells.${ch.sid}.${dk(ch.d)}`] = cleanCell(ch.cell); }
  if(text) patch[`history.${uid('h')}`] = {ts:Date.now(), by:S.user.name, text};
  await patchMonth(patch);
  if(Object.keys(p2).length){ if(text) p2[`history.${uid('h')}`] = {ts:Date.now(), by:S.user.name, text:`(前月の勤務表から)${text}`}; await patchYm(shiftYm(S.ym,1), p2); }
}
function changesBetween(ctx, A, B, sids){
  const out = [];
  for(const sid of sids) for(let d=1; d<=ctx.n; d++){ const a = gget(A,sid,d), b = gget(B,sid,d); if(diffCell(a,b) || !!a?.lock !== !!b?.lock || !!a?.cnt !== !!b?.cnt) out.push({sid, d, cell:b || null}); }
  return out;
}
async function regen(mode, focusDays, extraRemoved){
  const ctx = makeCtx(); if(extraRemoved) ctx.month = {...ctx.month, removed:{...(ctx.month.removed || {}), [extraRemoved]:true}};
  const cells = ctx.month.cells || {}, removed = ctx.month.removed || {}, keep = {};
  const put = (sid,k,c) => { (keep[sid] = keep[sid] || {})[k] = c; };
  let label = '自動作成(全体)';
  if(mode === 'all'){
    for(const sid in cells) for(const k in cells[sid]) if(cells[sid][k].lock || +k.slice(1) <= ctx.prevExt) put(sid, k, cells[sid][k]);
  } else {
    const days = new Set(focusDays || []);
    if(!focusDays){ const an = analyze(ctx, cells); Object.keys(an.day).forEach(d => days.add(+d)); for(const sid in an.cell) Object.keys(an.cell[sid]).forEach(d => days.add(+d)); }
    if(!days.size){ toast('問題のある日はありません'); return; }
    const win = new Set(); days.forEach(d => { for(let k=d-2; k<=d+2; k++) if(k >= 1 && k <= ctx.n) win.add(k); });
    ctx.editDays = win;
    for(const sid in cells) for(const k in cells[sid]){
      const d = +k.slice(1), c = cells[sid][k];
      if(c.lock){ put(sid, k, c); continue; }
      if(win.has(d)) continue;
      if(c.s === 'A' && win.has(d-1)) continue;
      put(sid, k, c);
    }
    label = '部分的に組み直し:' + [...win].sort((a,b)=>a-b).map(d => md(d)).join(',');
  }
  for(const sid in keep) for(const k in keep[sid]){ const c = keep[sid][k]; if(c.s === 'X' && !c.lock && removed[c.slot + '_' + k]) delete keep[sid][k]; }
  const G = generate(ctx, keep), n0 = ctx.n0, own = {}, p2 = {};
  for(const sid in G) for(const k in G[sid]){ if(+k.slice(1) <= n0) (own[sid] = own[sid] || {})[k] = G[sid][k]; }
  await patchMonth({cells:own, [`history.${uid('h')}`]:{ts:Date.now(), by:S.user.name, text:label}});
  if(ctx.ext){
    for(const s of ctx.staff) for(let j=1; j<=ctx.ext; j++){ if(!ed(ctx, n0 + j)) continue; p2[`cells.${s.id}.${dk(j)}`] = cleanCell(G[s.id]?.[dk(n0 + j)]); }
    p2[`history.${uid('h')}`] = {ts:Date.now(), by:S.user.name, text:`前月の勤務表と一緒に作成:1〜${ctx.ext}日`};
    await patchYm(shiftYm(S.ym,1), p2);
  }
  toast('組み直しました');
}
async function confirmVersion(cellsOverride, note){
  const m = S.month, n = (m.confirmed || 0) + 1, ctx = makeCtx({noExt:true});
  const prevCells = m.confirmed ? m.versions?.['v' + m.confirmed]?.cells : null;
  const cells = cellsOverride || m.cells || {}, ts = Date.now(), patch = {};
  patch['versions.v' + n] = {ts, by:S.user.name, cells};
  patch.confirmed = n;
  if(prevCells){
    const by = {};
    for(const x of diffCells(prevCells, cells)) (by[x.sid] = by[x.sid] || []).push(`${md(x.d)} ${cellLabel(x.from, ctx.cfg)||'空'}→${cellLabel(x.to, ctx.cfg)||'空'}${x.to?.dc?'(DC)':''}`);
    for(const sid in by) if(ctx.map[sid]) patch[`notifications.${sid}.${uid('n')}`] = {ts, read:false, text:`勤務表 第${n}版であなたの勤務が変更されました:${by[sid].join('、')}${note ? '(' + note + ')' : ''}`};
  } else {
    for(const s of ctx.staff) patch[`notifications.${s.id}.${uid('n')}`] = {ts, read:false, text:`${+S.ym.slice(5)}月の勤務表(第1版)が配信されました。`};
  }
  patch[`history.${uid('h')}`] = {ts, by:S.user.name, text:`第${n}版を確定・配信${note ? '(' + note + ')' : ''}`};
  await patchMonth(patch);
  toast(`第${n}版を配信しました`);
}

    const ctx = makeCtx({noExt:true}), cells = S.month.cells || {}, c = gget(cells, sid, d);
    if(!Object.keys(cells).length || c?.lock) return;
    const code = k ? KEY2CODE[k] : '';
    const ch = [];
    const nx = d < ctx.n ? gget(cells, sid, d+1) : null;
    if(code){
      ch.push({sid, d, cell:{s:code}});
      if(c?.s === 'N' && nx?.s === 'A' && !isCenterNight(code)) ch.push({sid, d:d+1, cell:fallbackCell(ctx, sid, d+1, null)});
      if(isCenterNight(code) && d < ctx.n && !nx?.lock && !isCenter(nx?.s)) ch.push({sid, d:d+1, cell:{s:'O'}});   // 翌日は休み
      if((code === 'IC' || code === 'HK') && d < ctx.n && !nx?.lock && !isCenter(nx?.s)) ch.push({sid, d:d+1, cell:{s:'A'}});   // ICU・本館直の翌日は明け
    } else if(isCenter(c?.s) || before){
      ch.push({sid, d, cell:fallbackCell(ctx, sid, d, null)});
      if(isCenterNight(c?.s) && nx?.s === 'O' && !nx.lock) ch.push({sid, d:d+1, cell:fallbackCell(ctx, sid, d+1, null)});
      if((c?.s === 'IC' || c?.s === 'HK') && nx?.s === 'A' && !nx.lock) ch.push({sid, d:d+1, cell:fallbackCell(ctx, sid, d+1, null)});
    }
    if(ch.length) await commit(ch, `${ctx.map[sid].name} ${md(d)}:${code ? centerLabel(code, ctx.days[d-1].hol) : 'センター勤務を解除'}`);
  },
  setReqView(v){ S.reqView = v; render(); },
  openReqDay(sid, d){ S.modal = {type:'reqday', sid, d}; renderModal(); },
  setCalAll(v){ S.calAll = v; render(); },
  setCalView(v){ S.calView = v; render(); },
  openCalDay(d){ S.modal = {type:'calday', d, live:true}; renderModal(); },
  setReqTarget(id){ S.reqTarget = id; render(); },
  async setDone(sid, on){
    if(sid !== S.user.id && !S.user.admin){ toast('自分の分だけ変更できます'); return; }
    try { document.activeElement?.blur(); } catch(e){}
    const patch = {[`done.${sid}`]: on ? {ts:Date.now(), by:S.user.name} : null};
    if(on && sid === S.user.id && !S.user.admin){ const nm = S.user.name; S.cfg.staff.filter(a => a.admin && a.active !== false && a.id !== S.user.id).forEach(a => { patch[`notifications.${a.id}.${uid('n')}`] = {ts:Date.now(), read:false, text:`${nm}:${+S.ym.slice(5)}月の希望入力が完了しました`}; }); }
    await patchMonth(patch); toast(on ? '入力完了にしました' : '入力完了を取り消しました');
  },
  async remindUndone(){
    const ctx = makeCtx({noExt:true}), nd = doneTargets(ctx).filter(s => !S.month.done?.[s.id]); if(!nd.length) return;
    if(!confirm(`${nd.map(s => s.name).join('・')} に、希望入力の完了をお願いするお知らせを送りますか?`)) return;
    const patch = {}, dl = S.month.deadline ? `(締切 ${S.month.deadline})` : '';
    nd.forEach(s => { patch[`notifications.${s.id}.${uid('n')}`] = {ts:Date.now(), read:false, text:`${+S.ym.slice(5)}月の希望入力がまだ完了になっていません${dl}。入力が終わったら希望入力画面の「入力は完了しました」にチェックしてください。`}; });
    await patchMonth(patch); toast(`${nd.length}人に送りました`);
  },
  boardHide(){ S.boardHide = true; render(); },
  async boardAdd(){
    const text = document.getElementById('bd_text').value.trim(); if(!text){ toast('内容を書いてください'); return; }
    const until = document.getElementById('bd_until').value || '', pin = document.getElementById('bd_pin').checked, notify = document.getElementById('bd_notify').checked;
    await saveCfg(c => { c.board = [...(c.board || []), {id:uid('b'), text, until, pin, ts:Date.now(), by:S.user.name}]; });
    if(notify){ const patch = {}; S.cfg.staff.filter(s => s.active !== false && s.id !== S.user.id).forEach(s => { patch[`notifications.${s.id}.${uid('n')}`] = {ts:Date.now(), read:false, text:'📢 ' + (text.length > 60 ? text.slice(0, 60) + '…' : text)}; }); await patchMonth(patch); }
    S.boardHide = false; toast('掲示しました');
  },
  async boardPin(id){ await saveCfg(c => { const x = (c.board || []).find(b => b.id === id); if(x) x.pin = !x.pin; }); },
  async boardDel(id){ if(!confirm('この掲示を削除しますか?')) return; await saveCfg(c => { c.board = (c.board || []).filter(b => b.id !== id); }); },
  async reqWant(sid, d, k){ await reqUpdate(sid, d, r => { if(r.want === k) delete r.want; else r.want = k; }); },
  async reqToggle(sid, d, f){
    const wf = wkOf(S.cfg.staff.find(x => x.id === sid), dateOf(S.ym, d).getDay());
    if(wf[f]){ await reqUpdate(sid, d, r => { r.unset = r.unset || {}; if(r.unset[f]) delete r.unset[f]; else r.unset[f] = true; if(!Object.keys(r.unset).length) delete r.unset; }); return; }
    await reqUpdate(sid, d, r => { r[f] = !r[f]; if(CENTER_KEYS.includes(f) && r[f]) CENTER_KEYS.filter(k => k !== f).forEach(k => r[k] = false); }); },
  async reqAddTime(sid, d){
    const a = document.getElementById('tf_' + d).value, b = document.getElementById('tt_' + d).value;
    if(!a || !b){ toast('開始と終了の時刻を入れてください'); return; }
    await reqUpdate(sid, d, r => { r.times = r.times || []; r.times.push({from:a, to:b}); });
  },
  async reqDelTime(sid, d, i){ await reqUpdate(sid, d, r => { r.times.splice(i, 1); }); },
  async reqNote(sid, d, v){ await reqUpdate(sid, d, r => { r.note = v.trim(); }); },
  // 交代申請
  swf(k, v){ S.swf[k] = v; if(k === 'to') S.swf.e = ''; render(); },
  async swapSubmit(){
    const f = S.swf, me = S.user.id;
    if(!f.d || !f.to){ toast('自分の日と相手を選んでください'); return; }
    if(f.type === 'swap' && !f.e){ toast('相手の日を選んでください'); return; }
    const id = uid('w'), ts = Date.now(), note = document.getElementById('swnote').value.trim();
    await patchMonth({[`swaps.${id}`]:{from:me, to:f.to, d:+f.d, e:f.type === 'swap' ? +f.e : null, note, status:'pending', ts},
      [`notifications.${f.to}.${uid('n')}`]:{ts, read:false, text:`${S.user.name}から交代の申請があります(${md(+f.d)})。「交代申請」で承諾・辞退してください。`}});
    S.swf = {}; toast('申請しました');
  },
  async swapRespond(id, ok){
    const x = S.month.swaps[id], ts = Date.now(), patch = {[`swaps.${id}.status`]:ok ? 'accepted' : 'declined'};
    patch[`notifications.${x.from}.${uid('n')}`] = {ts, read:false, text:`${S.user.name}が交代申請(${md(x.d)})を${ok ? '承諾しました。調整役の承認待ちです' : '辞退しました'}。`};
    if(ok) S.cfg.staff.filter(a => a.admin && a.active !== false).forEach(a => { patch[`notifications.${a.id}.${uid('n')}`] = {ts, read:false, text:`交代申請の承認待ちがあります(${md(x.d)})。`}; });
    await patchMonth(patch);
  },
  async swapApprove(id, ok){
    const x = S.month.swaps[id], ts = Date.now(), ctx = makeCtx({noExt:true});
    const nm = sid => ctx.map[sid]?.name || '';
    if(!ok){
      await patchMonth({[`swaps.${id}.status`]:'rejected', [`notifications.${x.from}.${uid('n')}`]:{ts, read:false, text:`交代申請(${md(x.d)})は調整役により却下されました。`}, [`notifications.${x.to}.${uid('n')}`]:{ts, read:false, text:`交代申請(${md(x.d)})は調整役により却下されました。`}});
      return;
    }
    const draft = S.month.cells || {}, ds = swapDays(draft, x, ctx.n), C = swapRows(ctx, draft, x.from, x.to, ds);
    await commit(changesBetween(ctx, draft, C, [x.from, x.to]), `交代申請を承認:${nm(x.from)} ⇔ ${nm(x.to)}(${ds.map(md).join(',')})`);
    await patchMonth({[`swaps.${id}.status`]:'approved'});
    await confirmVersion(C, '交代申請の承認');
  },
  async swapCancel(id){ await patchMonth({[`swaps.${id}.status`]:'cancelled'}); },
  async readAll(){ const nn = S.month?.notifications?.[S.user.id] || {}, patch = {}; for(const k in nn) if(!nn[k].read) patch[`notifications.${S.user.id}.${k}.read`] = true; await patchMonth(patch); },
  async changePin(){
    const p0 = document.getElementById('pp0').value, p1 = document.getElementById('pp1').value, p2 = document.getElementById('pp2').value;
    const me = S.cfg.staff.find(s => s.id === S.user.id);
    if(await hashPin(me.id, p0) !== me.pinHash){ toast('今のPINが違います'); return; }
    if(p1.length < 4 || p1 !== p2){ toast('新しいPINは4桁以上で、2回同じものを入れてください'); return; }
    const h = await hashPin(me.id, p1);
    await saveCfg(c => { c.staff.find(s => s.id === me.id).pinHash = h; });
    toast('PINを変更しました');
  },
  // スタッフ
  staffEdit(id){
    const s = id ? clone(S.cfg.staff.find(x => x.id === id)) : newStaff('', 'senmon');
    S.modal = {type:'staff', id, draft:s}; renderModal();
  },
  dset(f, v, re, typeChange){
    const x = S.modal.draft; x[f] = v;
    if(typeChange && !S.modal.id){ x.canDuty = v === 'senmon'; x.canDC = v === 'senmon'; if(v === 'visitor'){ x.weekly = x.weekly || {}; } }
    if(re) renderModal();
  },
  dsetPerm(k, v){ const x = S.modal.draft; x.perms = x.perms || {}; if(v) x.perms[k] = true; else delete x.perms[k]; },
  dsetWeekly(w, k, on){
    const x = S.modal.draft; x.weekly = x.weekly || {};
    const f = {...wkOf(x, w)};
    if(on){ f[k] = true; if(k === 'D') delete f.M; if(k === 'M') delete f.D; } else delete f[k];
    if(Object.keys(f).length) x.weekly[w] = f; else delete x.weekly[w];
    if(k === 'D' || k === 'M') renderModal();
  },
  leaveAdd(){
    const label = document.getElementById('lv_label').value.trim(), from = document.getElementById('lv_from').value, to = document.getElementById('lv_to').value;
    if(!from || !to || from > to){ toast('期間を正しく入れてください'); return; }
    S.modal.draft.leaves.push({label:label || '休職', from, to}); renderModal();
  },
  leaveDel(i){ S.modal.draft.leaves.splice(i, 1); renderModal(); },
  async staffSave(){
    const x = S.modal.draft, isNew = !S.modal.id;
    if(!x.name.trim()){ toast('氏名を入れてください'); return; }
    const pin = document.getElementById('st_pin').value;
    if(pin && pin.length < 4){ toast('PINは4桁以上です'); return; }
    if(pin || isNew){ x.pinHash = await hashPin(x.id, pin || '0000'); x.locked = false; x.failCount = 0; delete x.lockedAt; }
    if(x.type === 'visitor' || x.type === 'clerk'){ x.canDuty = false; x.canDC = false; }
    if(x.type === 'clerk'){ x.dayOnly = false; delete x.licenseYear; x.weekly = {}; x.leaves = []; }
    if(!isNew && S.modal.id === S.user.id && !x.admin){ toast('自分の調整役権限は外せません'); return; }
    await saveCfg(c => { const i = c.staff.findIndex(s => s.id === x.id); if(i >= 0) c.staff[i] = x; else c.staff.push(x); });
    S.modal = null; renderModal(); toast('保存しました');
  },
  staffDelete(id){ if(id === S.user.id){ toast('自分自身は削除できません'); return; } App.ask('このスタッフを削除します。過去の勤務表からも表示されなくなります。一時的に外すだけなら「有効」のチェックを外してください。', 'staffDeleteDo', id); },
  async staffDeleteDo(id){ await saveCfg(c => { c.staff = c.staff.filter(s => s.id !== id); }); },
  async staffMove(id, k){ await saveCfg(c => { const i = c.staff.findIndex(s => s.id === id), j = i + k; if(j < 0 || j >= c.staff.length) return; [c.staff[i], c.staff[j]] = [c.staff[j], c.staff[i]]; }); },
  // 外勤
  async hospAdd(){ const v = document.getElementById('hp_new').value.trim(); if(!v) return; await saveCfg(c => c.hospitals.push({id:uid('h'), name:v})); },
  async hospRename(id, v){ await saveCfg(c => { c.hospitals.find(h => h.id === id).name = v.trim(); }); },
  async hospDel(id){ if(S.cfg.extSlots.some(s => s.hospId === id)){ toast('この派遣先の枠を先に削除してください'); return; } await saveCfg(c => { c.hospitals = c.hospitals.filter(h => h.id !== id); }); },
  slotEdit(id){
    const s = id ? clone(S.cfg.extSlots.find(x => x.id === id)) : {id:uid('x'), hospId:S.cfg.hospitals[0]?.id, freq:'weekly', weekday:1, count:1, start:'09:00', end:'17:00', nextAke:false, skipHoliday:true, mode:'auto', eligible:[], fixedStaff:[], priority:'optional'};
    S.modal = {type:'slot', id, draft:s}; renderModal();
  },
  dToggleArr(f, id){ const x = S.modal.draft; x[f] = x[f] || []; const i = x[f].indexOf(id); if(i >= 0) x[f].splice(i, 1); else x[f].push(id); },
  async slotSave(){
    const x = S.modal.draft;
    if(x.mode === 'fixed' && !(x.fixedStaff||[]).length){ toast('固定の担当者を選んでください'); return; }
    await saveCfg(c => { const i = c.extSlots.findIndex(s => s.id === x.id); if(i >= 0) c.extSlots[i] = x; else c.extSlots.push(x); });
    S.modal = null; renderModal(); toast('保存しました');
  },
  slotDel(id){ App.ask('この外勤の枠を削除します。', 'slotDelDo', id); },
  async slotDelDo(id){ await saveCfg(c => { c.extSlots = c.extSlots.filter(s => s.id !== id); }); },
  // 設定
  async setSetting(k, v){ await saveCfg(c => { c.settings[k] = v; }); },
  async setExtend(v){ v = Math.max(0, Math.min(10, Math.floor(+v || 0))); await patchMonth({extendDays: v || null}); },
  async spAdd(){
    const name = document.getElementById('sp_name').value.trim() || '年末年始', from = document.getElementById('sp_from').value, to = document.getElementById('sp_to').value;
    if(!from || !to || from > to){ toast('期間を正しく入れてください'); return; }
    const split = document.getElementById('sp_split').checked;
    await saveCfg(c => { c.specialPeriods = c.specialPeriods || []; c.specialPeriods.push({id:uid('p'), name, from, to, split}); });
  },
  async spSplit(id, v){ await saveCfg(c => { const sp = (c.specialPeriods || []).find(x => x.id === id); if(sp) sp.split = v; }); },
  async spDel(id){ await saveCfg(c => { c.specialPeriods = (c.specialPeriods || []).filter(x => x.id !== id); }); },
  async setDeadline(v){ await patchMonth({deadline:v || null}); },
  async holToggle(isoD){ await saveCfg(c => { const o = c.holidayOverrides[isoD]; if(o === undefined) c.holidayOverrides[isoD] = true; else if(o === true) c.holidayOverrides[isoD] = 'split'; else if(o === 'split') c.holidayOverrides[isoD] = false; else delete c.holidayOverrides[isoD]; }); },
  async exportJSON(){
    const months = {}; for(const ym of await S.store.listMonths()) months[ym] = await S.store.get('months/' + ym);
    const data = {app:'kinmu', exported:new Date().toISOString(), config:S.cfg, months};
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:'application/json'})); a.download = `勤務表バックアップ_${todayISO()}.json`; a.click();
  },
  importJSON(input){
    const f = input.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const data = JSON.parse(rd.result); if(data.app !== 'kinmu' || !data.config) throw new Error('形式が違います'); S._import = data; App.ask(`バックアップ(${data.exported || ''})を読み込みます。いまの設定と、バックアップに含まれる月のデータは上書きされます。`, 'importDo'); } catch(e){ toast('読み込めません: ' + e.message); } };
    rd.readAsText(f);
  },
  async importDo(){ const data = S._import; for(const ym in (data.months || {})) await S.store.set('months/' + ym, data.months[ym] || {}); await S.store.set('config', data.config); toast('読み込みました'); },
  saveFbConfig(){
    const t = document.getElementById('fbconf').value.trim();
    try { const o = t.startsWith('{') ? (new Function('return ' + t))() : (new Function('return {' + t + '}'))(); if(!o.projectId) throw 0; localStorage.setItem('kinmu:fbconfig', JSON.stringify(o)); location.reload(); }
    catch(e){ toast('設定値を読み取れません。{ } ごと貼り付けてください'); }
  },
  clearFbConfig(){ localStorage.removeItem('kinmu:fbconfig'); location.reload(); }
};
window.App = App;

async function boot(){
  let conf = FIREBASE_CONFIG;
  if(!conf){ try { conf = JSON.parse(localStorage.getItem('kinmu:fbconfig') || 'null'); } catch(e){} }
  if(conf){ try { S.store = new FireStore(await loadFirebase(conf)); S.mode = 'firebase'; } catch(e){ console.error(e); toast('Firebaseに接続できません。デモモードで動きます'); } }
  if(!S.store){ S.store = new LocalStore(); S.mode = 'local'; }
  const now = new Date(), nm = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  S.ym = ymStr(nm.getFullYear(), nm.getMonth() + 1);
  S.store.subscribe('config', cfg => {
    S.cfg = normCfg(cfg);
    if(S.cfg){ const sid = localStorage.getItem('kinmu:sid'); setUser(S.cfg.staff.find(s => s.id === sid && s.active !== false) || null); } else setUser(null);
    requestRender();
  });
  subscribeMonth();
}
boot();
</script>
